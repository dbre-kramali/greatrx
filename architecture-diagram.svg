<svg width="640" height="760" viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="640" height="760" fill="#ffffff"/>

  <!-- Box 1: RDS PostgreSQL -->
  <rect x="40" y="40" width="560" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="100" cy="90" r="28" fill="#dbeafe"/>
  <g transform="translate(100,90)" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="-9" rx="9" ry="4"/>
    <path d="M-9,-9 V9 A9,4 0 0,0 9,9 V-9"/>
    <path d="M-9,0 A9,4 0 0,0 9,0"/>
  </g>
  <text x="160" y="80" font-size="18" font-weight="600" fill="#111827">Amazon RDS PostgreSQL</text>
  <text x="160" y="104" font-size="14" fill="#6b7280">Operational source database</text>

  <line x1="320" y1="140" x2="320" y2="180" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: AWS Glue -->
  <rect x="40" y="180" width="560" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="100" cy="230" r="28" fill="#dbeafe"/>
  <g transform="translate(100,230)" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -9,-3 A 10,10 0 1,1 -9,3"/>
    <path d="M -13,-7 L -9,-3 L -5,-8" fill="#2563eb" stroke="none"/>
    <path d="M 9,3 A 10,10 0 1,1 9,-3"/>
    <path d="M 13,7 L 9,3 L 5,8" fill="#2563eb" stroke="none"/>
  </g>
  <text x="160" y="220" font-size="18" font-weight="600" fill="#111827">AWS Glue</text>
  <text x="160" y="244" font-size="14" fill="#6b7280">Extract, crawl, catalog, land to S3</text>

  <line x1="320" y1="280" x2="320" y2="320" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Amazon S3 -->
  <rect x="40" y="320" width="560" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="100" cy="370" r="28" fill="#dbeafe"/>
  <path transform="translate(100,370)" d="M -12,6 A 7,7 0 0,1 -10,-6 A 9,9 0 0,1 6,-9 A 8,8 0 0,1 13,6 Z"
        fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
  <text x="160" y="360" font-size="18" font-weight="600" fill="#111827">Amazon S3 Data Lake</text>
  <text x="160" y="384" font-size="14" fill="#6b7280">Raw + bronze layer, Parquet</text>

  <line x1="320" y1="420" x2="320" y2="460" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Databricks -->
  <rect x="40" y="460" width="560" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="100" cy="510" r="28" fill="#ede9fe"/>
  <g transform="translate(100,510)" stroke="#7c3aed" stroke-width="2" fill="none">
    <rect x="-8" y="-8" width="16" height="16" rx="2"/>
    <line x1="-8" y1="-4" x2="-12" y2="-4"/>
    <line x1="-8" y1="4" x2="-12" y2="4"/>
    <line x1="8" y1="-4" x2="12" y2="-4"/>
    <line x1="8" y1="4" x2="12" y2="4"/>
    <line x1="-4" y1="-8" x2="-4" y2="-12"/>
    <line x1="4" y1="-8" x2="4" y2="-12"/>
    <line x1="-4" y1="8" x2="-4" y2="12"/>
    <line x1="4" y1="8" x2="4" y2="12"/>
  </g>
  <text x="160" y="500" font-size="18" font-weight="600" fill="#111827">Databricks</text>
  <text x="160" y="524" font-size="14" fill="#6b7280">Delta Lakehouse layer — silver + gold</text>

  <line x1="320" y1="560" x2="320" y2="600" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 5: Consumption -->
  <rect x="40" y="600" width="560" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="100" cy="650" r="28" fill="#ffedd5"/>
  <g transform="translate(100,650)" fill="#ea580c">
    <rect x="-10" y="0" width="5" height="10"/>
    <rect x="-2" y="-6" width="5" height="16"/>
    <rect x="6" y="-10" width="5" height="20"/>
  </g>
  <text x="160" y="640" font-size="18" font-weight="600" fill="#111827">Consumption</text>
  <text x="160" y="664" font-size="14" fill="#6b7280">BI dashboards, ML, ad hoc analytics</text>
</svg>
